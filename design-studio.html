<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f4f6" />
  <title>Design Studio</title>
  <link rel="stylesheet" href="design-studio.css" />
</head>
<body>
  <main id="galleryScreen" class="screen gallery-screen">
    <header class="gallery-header">
      <a href="index.html" class="gallery-back" aria-label="Back">‹</a>
      <h1>Gallery</h1>
      <div class="gallery-actions">
        <button id="selectGalleryBtn" class="text-button">Select</button>
        <button id="newDesignBtn" class="plus-button" aria-label="Create new design">＋</button>
      </div>
    </header>

    <section id="galleryGrid" class="gallery-grid" aria-live="polite"></section>

    <section id="emptyGallery" class="empty-gallery">
      <div class="empty-sheet"></div>
      <h2>Your designs live here</h2>
      <p>Create your first fashion sketch.</p>
      <button id="emptyCreateBtn" class="primary-button">Create New</button>
    </section>
  </main>

  <main id="editorScreen" class="screen editor-screen hidden">
    <header class="editor-toolbar">
      <div class="toolbar-side toolbar-left">
        <button id="backToGalleryBtn" class="icon-button" aria-label="Gallery">
          <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>
        </button>
        <button id="actionsBtn" class="icon-button" aria-label="Actions">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.8"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
        </button>
        <button id="undoBtn" class="icon-button" aria-label="Undo">
          <svg viewBox="0 0 24 24"><path d="M9 7 4.5 11.5 9 16"/><path d="M5 11.5h8.5a5 5 0 0 1 5 5V18"/></svg>
        </button>
        <button id="redoBtn" class="icon-button" aria-label="Redo">
          <svg viewBox="0 0 24 24"><path d="m15 7 4.5 4.5L15 16"/><path d="M19 11.5h-8.5a5 5 0 0 0-5 5V18"/></svg>
        </button>
      </div>

      <input id="designNameInput" class="design-name-input" value="Untitled Artwork" aria-label="Design name" />

      <div class="toolbar-side toolbar-right">
        <button id="brushBtn" class="icon-button active" aria-label="Brush">
          <svg viewBox="0 0 24 24"><path d="M15 4c2.3 1 4 2.6 5 5L10 19l-5 1 1-5L15 4Z"/><path d="m12.5 6.5 5 5"/></svg>
        </button>
        <button id="smudgeBtn" class="icon-button" aria-label="Smudge">
          <svg viewBox="0 0 24 24"><path d="M8 14V9a1.7 1.7 0 0 1 3.4 0v3"/><path d="M11.4 12V7.5a1.7 1.7 0 0 1 3.4 0V12"/><path d="M14.8 12V9.2a1.7 1.7 0 0 1 3.4 0v5.2c0 4-2.4 6.4-6.2 6.4-2.4 0-4.4-1.2-5.7-3.2L4.3 15a1.7 1.7 0 1 1 2.5-2.2L8 14Z"/></svg>
        </button>
        <button id="eraserBtn" class="icon-button" aria-label="Eraser">
          <svg viewBox="0 0 24 24"><path d="m7 17-3-3 8.5-8.5a2.1 2.1 0 0 1 3 0l3 3a2.1 2.1 0 0 1 0 3L13 17H7Z"/><path d="M12 17h7"/></svg>
        </button>
        <button id="layersBtn" class="icon-button" aria-label="Layers">
          <svg viewBox="0 0 24 24"><path d="m12 4 8 4-8 4-8-4 8-4Z"/><path d="m4 12 8 4 8-4"/><path d="m4 16 8 4 8-4"/></svg>
        </button>
        <button id="colourBtn" class="colour-button" aria-label="Colour"><span id="colourDot"></span></button>
      </div>
    </header>

    <section id="canvasViewport" class="canvas-viewport">
      <div id="canvasStage" class="canvas-stage">
        <canvas id="displayCanvas" width="900" height="1100"></canvas>
      </div>

      <div class="edge-controls">
        <label class="vertical-slider">
          <output id="sizeOutput">18%</output>
          <input id="sizeSlider" type="range" min="2" max="120" value="22" aria-label="Brush size" />
          <span class="size-dot">●</span>
        </label>
        <label class="vertical-slider">
          <output id="opacityOutput">100%</output>
          <input id="opacitySlider" type="range" min="5" max="100" value="100" aria-label="Opacity" />
          <span class="opacity-dot">◐</span>
        </label>
      </div>

      <div class="view-switcher" aria-label="Design side">
        <div class="side-segment">
          <button class="side-button active" data-side="front">Front</button>
          <button class="side-button" data-side="back">Back</button>
        </div>
        <button id="overlayBtn" class="overlay-button" aria-pressed="false">Overlay</button>
      </div>
    </section>

    <aside id="brushPanel" class="floating-panel brush-panel hidden" aria-label="Brush Library">
      <div class="panel-titlebar">
        <strong>Brush Library</strong>
        <button class="close-panel" data-close-panel>×</button>
      </div>
      <div class="brush-library">
        <nav id="brushCategories" class="brush-categories"></nav>
        <div id="brushList" class="brush-list"></div>
      </div>
    </aside>

    <aside id="layersPanel" class="floating-panel layers-panel hidden" aria-label="Layers">
      <div class="panel-titlebar">
        <strong>Layers</strong>
        <button id="addLayerBtn" class="panel-plus" aria-label="Add layer">＋</button>
      </div>
      <div id="layersList" class="layers-list"></div>
    </aside>

    <aside id="colourPanel" class="floating-panel colour-panel hidden" aria-label="Colours">
      <div class="panel-titlebar">
        <strong>Colours</strong>
        <button class="close-panel" data-close-panel>×</button>
      </div>

      <div class="colour-tabs" role="tablist">
        <button class="colour-tab active" data-colour-tab="disc">Disc</button>
        <button class="colour-tab" data-colour-tab="classic">Classic</button>
        <button class="colour-tab" data-colour-tab="palettes">Palettes</button>
      </div>

      <section class="colour-view" data-colour-view="disc">
        <div class="disc-picker-wrap">
          <canvas id="colourDisc" width="240" height="240" aria-label="Colour wheel"></canvas>
          <div id="discMarker" class="disc-marker"></div>
        </div>
      </section>

      <section class="colour-view hidden" data-colour-view="classic">
        <div class="classic-picker-wrap">
          <canvas id="classicSquare" width="260" height="180" aria-label="Saturation and brightness picker"></canvas>
          <div id="classicMarker" class="classic-marker"></div>
        </div>
        <input id="hueSlider" class="hue-slider" type="range" min="0" max="360" value="0" aria-label="Hue" />
      </section>

      <section class="colour-view hidden" data-colour-view="palettes">
        <div class="palette-toolbar">
          <select id="paletteSelect" aria-label="Saved palettes"></select>
          <button id="newPaletteBtn" class="mini-action">＋ Palette</button>
        </div>
        <div id="savedPalette" class="saved-palette"></div>
        <button id="addColourToPaletteBtn" class="palette-add-current">＋ Add current colour</button>
      </section>

      <div class="colour-current-row">
        <button id="eyedropperBtn" class="eyedropper-button" type="button">⌾ Eyedropper</button>
        <div class="current-colour-preview"><span id="currentColourChip"></span><span id="currentColourText">#111111</span></div>
      </div>

      <div class="colour-row">
        <label>Hex</label>
        <input id="hexInput" value="#111111" maxlength="7" inputmode="text" />
        <input id="colourPicker" class="native-colour-input" type="color" value="#111111" aria-label="System colour picker" />
      </div>

      <div class="section-label">Recent <span class="section-hint">hold to remove</span></div>
      <div id="recentColours" class="recent-colours"></div>
    </aside>

    <aside id="actionsPanel" class="floating-panel actions-panel hidden" aria-label="Actions">
      <div class="panel-titlebar">
        <strong>Actions</strong>
        <button class="close-panel" data-close-panel>×</button>
      </div>
      <button class="action-row" id="croquisAction">Croquis <span>›</span></button>
      <label class="action-row file-row">Add reference image <span>›</span><input id="referenceInput" type="file" accept="image/*" /></label>
      <button class="action-row" id="fitCanvasAction">Fit canvas <span>⌗</span></button>
      <button class="action-row" id="exportAction">Export PNG <span>↥</span></button>
      <button class="action-row danger" id="clearLayerAction">Clear active layer <span>×</span></button>
    </aside>

    <aside id="croquisPanel" class="floating-panel croquis-panel hidden" aria-label="Croquis">
      <div class="panel-titlebar">
        <strong>Croquis</strong>
        <button class="close-panel" data-close-panel>×</button>
      </div>
      <label class="toggle-row">
        <span>Show croquis</span>
        <input id="croquisVisibleToggle" type="checkbox" checked />
      </label>
      <div class="croquis-opacity-row">
        <span>Opacity</span><output id="croquisOpacityOutput">35%</output>
        <input id="croquisOpacitySlider" type="range" min="0" max="100" value="35" />
      </div>
      <p class="panel-note">Front and Back belong to the same design. Use the switch above the canvas to move between them.</p>
    </aside>
  </main>

  <div id="createModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="createTitle">
    <div class="modal-card">
      <div class="modal-titlebar">
        <button id="cancelCreateBtn" class="text-button">Cancel</button>
        <h2 id="createTitle">New canvas</h2>
        <span></span>
      </div>
      <div class="new-canvas-options two-options">
        <button class="new-canvas-card" data-new-kind="fashion">
          <div class="pair-preview">
            <img src="design-assets/croquis-front.svg" alt="" />
            <img src="design-assets/croquis-back.svg" alt="" />
          </div>
          <strong>Fashion Design</strong>
          <small>Front + Back together</small>
        </button>
        <button class="new-canvas-card" data-new-kind="blank">
          <div class="blank-preview"></div>
          <strong>Blank Canvas</strong>
          <small>No croquis</small>
        </button>
      </div>
    </div>
  </div>

  <div id="galleryMenu" class="context-menu hidden">
    <button data-gallery-action="rename">Rename</button>
    <button data-gallery-action="duplicate">Duplicate</button>
    <button data-gallery-action="export">Export</button>
    <button data-gallery-action="delete" class="danger">Delete</button>
  </div>

  <div id="toast" class="toast"></div>
  <script src="design-studio.js"></script>
</body>
</html>
