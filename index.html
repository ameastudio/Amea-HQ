<!doctype html><html><head><link rel="apple-touch-icon" href="app-icon.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff4f9a"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><title>Améa HQ</title></head><body>
<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-brand"><img src="amea-logo.png" alt="Améa"><small>HQ</small></div>
    <h2>Welcome Back, Améa Boss ✨</h2>
    <p>Sign in to your private business workspace.</p>
    <label>Email</label>
    <input id="auth-email" type="email" autocomplete="username" placeholder="Business email">
    <label>Password</label>
    <input id="auth-password" type="password" autocomplete="current-password" placeholder="Password">
    <button id="auth-button" class="primary" onclick="loginHQ()">Sign In</button>
    <div id="auth-message" class="auth-message"></div>
  </div>
</div>
<div id="app" style="display:none"><header class="app-header">
  <div class="hq-header-orb orb-one"></div><div class="hq-header-orb orb-two"></div>
  <div class="hq-header-main">
    <button class="hq-brand-home" onclick="page('home')" aria-label="Go to HQ home">
      <div class="hq-logo-shell"><img src="amea-logo.png" alt="Améa"><span>HQ</span></div>
      <div class="hq-header-copy"><strong id="hqHeaderGreeting">Welcome back, Bri ♡</strong><span id="hqHeaderDate"></span></div>
    </button>
  </div>
</header><main id="view"></main><nav>
      <button onclick="page('home')" data-page="home"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5v8.2a1.4 1.4 0 0 1-1.4 1.4h-4.2v-5.7H9.6v5.7H5.4A1.4 1.4 0 0 1 4 18.7z"/></svg></span><span>HQ</span></button>
      <button onclick="page('orders')" data-page="orders"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7.2 12 4l7 3.2-7 3.5z"/><path d="M5 7.2v8.5l7 4.3 7-4.3V7.2M12 10.7V20"/></svg></span><span>Orders</span></button>
      <button onclick="page('studio')" data-page="studio"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.3"/><path d="M5.5 9.4c4.3-2 9.2-1.7 13 .6M5.6 14.5c4.1 1.4 9 1.1 12.8-1.1M8 5.2c2.7 3.1 4.9 7.1 6.3 12.7"/></svg></span><span>Studio</span></button>
      <button onclick="page('calendar')" data-page="calendar"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="15" rx="3"/><path d="M8 3.5v4M16 3.5v4M3.5 10h17"/></svg></span><span>Calendar</span></button>
      <button onclick="page('more')" data-page="more"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="7" r="1.7"/><circle cx="17" cy="7" r="1.7"/><circle cx="7" cy="17" r="1.7"/><circle cx="17" cy="17" r="1.7"/></svg></span><span>More</span></button>
    </nav></div><dialog id="dlg"><button class="close" onclick="dlg.close()">×</button><div id="form"></div></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
